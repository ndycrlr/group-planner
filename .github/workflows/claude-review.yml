name: Claude review

# Every change reaches main through a pull request, so opening one is the single
# moment where a review can run before the code is on the default branch.
# Reopening and marking ready count as opening for that purpose; a draft does
# not, because a draft is work still in flight and reviewing it burns Actions
# minutes on a diff that is about to change.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# Reopening a PR twice in a row only needs the last run.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # A token from `claude setup-token`, so reviews bill to the Claude
          # subscription rather than to prepaid API credits. Swapping to an API
          # key means swapping this line for `anthropic_api_key:` — the action
          # accepts either, and wants exactly one.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without a token of its own the action exchanges an OIDC token with
          # the Claude GitHub App, and fails outright if the App is not
          # installed on the repository. Handing it the workflow's own token
          # skips that exchange, so the review needs one secret rather than a
          # secret and an App install. The cost is whose name is on the
          # comments: github-actions[bot] rather than claude[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # CLAUDE.md is checked out and worth reading in full, but the
          # invariants it records are the ones a diff breaks quietly, so they
          # are named here rather than left to be noticed.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first — it records the
            conventions and the invariants this repository is built on. The PR
            branch is already checked out in the working directory.

            Weight the review towards correctness, and towards the invariants a
            diff can break without failing a test:

            - `public/dates.js` is imported by both the browser and `app.js`, so
              it must stay free of DOM and Node APIs. All date maths is on
              'YYYY-MM-DD' strings through Date.UTC/getUTC*; a bare
              `new Date('2026-08-20')` read back in local time shifts a day.
            - List and month views share one `renderCell` callback. A second
              render path — or a narrow-screen fix written in JS rather than in
              the two @media blocks in styles.css — is how the two drift apart.
            - Neither grid may scroll sideways at 320px.
            - A grid cell sets `--hue` (via data-part) and, on the results page,
              `--lit`, or it renders uncoloured. Brightness is never the only
              signal: the count and the `✓ all` ring carry it too.
            - In `db.js`: `lastInsertRowid` is a bigint and needs `Number()`;
              libSQL rows must be spread into plain objects; `connect()` memoises
              the connection promise but must never memoise a failure.
            - `GET /results` returns a dense grid — every date × every part.
            - Validation belongs in `app.js` and throws `HttpError`; its messages
              are user-facing copy, in British English.
            - Comments explain why, not what.

            Also check the PR title: it becomes the commit subject when the PR is
            squashed, and GitHub squashes server-side, where .githooks/commit-msg
            cannot run. It must be a Conventional Commit itself —
            `<type>[(scope)][!]: <description>`.

            Use `gh pr comment` for top-level feedback, and
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for findings tied to specific lines. Only post
            GitHub comments — do not submit review text as messages. Say plainly
            if you found nothing worth changing; do not invent findings to fill
            the review.

          # Reviewing means commenting, not committing: no write tools beyond
          # the comment paths.
          show_full_output: true
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
